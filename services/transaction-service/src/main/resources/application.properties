server.port=8080
spring.application.name=transaction-service

# Overridden by ECS task definition environment variables in real deployments.
# Local defaults assume both downstream services running on localhost via
# different ports for local testing without ECS.
debit.service.url=${DEBIT_SERVICE_URL:http://localhost:8081}
credit.service.url=${CREDIT_SERVICE_URL:http://localhost:8082}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

logging.pattern.console={"timestamp":"%d{ISO8601}","level":"%level","service":"transaction-service","logger":"%logger{36}","message":"%msg"}%n
logging.file.name=/var/log/test.log
logging.pattern.file={"timestamp":"%d{ISO8601}","level":"%level","service":"transaction-service","logger":"%logger{36}","message":"%msg"}%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=3
management.cloudwatch.metrics.export.enabled=true
management.cloudwatch.metrics.export.namespace=fintrace/transaction-service
management.cloudwatch.metrics.export.step=30s