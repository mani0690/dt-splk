server.port=8080
spring.application.name=debit-service

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Console stays on for CloudWatch/awslogs visibility into the running
# container. The file is what the splunk-uf sidecar tails - that's the
# actual path to Splunk now, not the console output.
logging.pattern.console={"timestamp":"%d{ISO8601}","level":"%level","service":"debit-service","logger":"%logger{36}","message":"%msg"}%n
logging.file.name=/var/log/test.log
logging.pattern.file={"timestamp":"%d{ISO8601}","level":"%level","service":"debit-service","logger":"%logger{36}","message":"%msg"}%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=3
management.cloudwatch.metrics.export.enabled=true
management.cloudwatch.metrics.export.namespace=fintrace/debit-service
management.cloudwatch.metrics.export.step=30s
