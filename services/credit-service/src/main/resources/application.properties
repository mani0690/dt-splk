server.port=8080
spring.application.name=credit-service

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

logging.pattern.console={"timestamp":"%d{ISO8601}","level":"%level","service":"credit-service","logger":"%logger{36}","message":"%msg"}%n
logging.file.name=/var/log/test.log
logging.pattern.file={"timestamp":"%d{ISO8601}","level":"%level","service":"credit-service","logger":"%logger{36}","message":"%msg"}%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=3
management.metrics.export.cloudwatch.enabled=true
management.metrics.export.cloudwatch.namespace=fintrace/transaction-service
management.metrics.export.cloudwatch.step=30s