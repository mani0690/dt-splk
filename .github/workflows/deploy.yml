name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "services/**"
  workflow_dispatch:
    inputs:
      run_terraform:
        description: "Also apply Terraform changes"
        type: boolean
        default: false

permissions:
  id-token: write   # required for OIDC - no AWS keys stored anywhere
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: fintrace-demo

jobs:
  terraform:
    if: ${{ github.event.inputs.run_terraform == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=fintrace-demo/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve
        env:
          TF_VAR_dynatrace_env_id: ${{ secrets.DYNATRACE_ENV_ID }}
          TF_VAR_dynatrace_paas_token: ${{ secrets.DYNATRACE_PAAS_TOKEN }}
          TF_VAR_splunk_uf_password: ${{ secrets.SPLUNK_UF_PASSWORD }}
          TF_VAR_github_org: ${{ github.repository_owner }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}

  build-uf-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Materialize Splunk Cloud credentials package
        # This file is gitignored on purpose - it never lives in the repo.
        # Stored as base64 in a secret since it's a binary .spl file.
        run: |
          echo "${{ secrets.SPLUNK_UF_CREDENTIALS_B64 }}" | base64 -d > services/splunk-uf-sidecar/splunkclouduf.spl

      - name: Build and push UF sidecar image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPO: ${{ env.PROJECT_NAME }}/splunk-uf-sidecar
        run: |
          docker build -t $REGISTRY/$REPO:latest services/splunk-uf-sidecar
          docker push $REGISTRY/$REPO:latest

  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [transaction-service, debit-service, credit-service]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPO: ${{ env.PROJECT_NAME }}/${{ matrix.service }}
        run: |
          docker build -t $REGISTRY/$REPO:latest -t $REGISTRY/$REPO:${{ github.sha }} services/${{ matrix.service }}
          docker push $REGISTRY/$REPO:latest
          docker push $REGISTRY/$REPO:${{ github.sha }}

  deploy:
    needs: [build-and-push, build-uf-sidecar]
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment on each ECS service
        run: |
          for svc in transaction-service debit-service credit-service; do
            aws ecs update-service \
              --cluster ${{ env.PROJECT_NAME }}-cluster \
              --service "$svc" \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }}
          done
